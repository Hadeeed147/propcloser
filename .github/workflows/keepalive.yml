name: keep-alive

# Keeps the API process AND the database awake during evaluation. /ready costs no tokens.
# Needs the repository variable API_URL (Settings → Secrets and variables → Actions → Variables).
# GitHub may delay scheduled runs; this reduces cold starts, it does not guarantee none.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.API_URL != '' }}
    steps:
      - run: |
          curl -fsS --max-time 90 --retry 3 --retry-all-errors "${{ vars.API_URL }}/health"
          echo
          curl -sS --max-time 60 "${{ vars.API_URL }}/ready"
