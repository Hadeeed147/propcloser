name: tests

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:                      # the real production storage path, across a restart
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci@localhost:5432/postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q -rs           # no API key, no cost: the model is a strict local stand-in

  image:
    runs-on: ubuntu-latest           # build the exact image we deploy, boot it, call it
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t dastak backend
      - run: docker run -d --name api -p 7860:7860 -e ANTHROPIC_API_KEY=not-a-key dastak
      - run: |
          for i in $(seq 1 30); do curl -fsS http://localhost:7860/health && break || sleep 1; done
          test "$(curl -fsS http://localhost:7860/health)" = "ok"
          curl -fsS -X POST http://localhost:7860/chat -H 'content-type: application/json' \
            -d '{"user_id":"ci","thread_id":"1","message":"write me a poem"}' | tee reply.json
          python3 -c "import json; r = json.load(open('reply.json')); assert set(r) == {'reply', 'tool_calls', 'tokens'}"
      - if: failure()
        run: docker logs api
