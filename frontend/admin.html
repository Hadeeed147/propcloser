<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PropCloser · Agency desk</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Overpass:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="admin.css">
  <script src="config.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./"><span class="sign" aria-hidden="true">PC</span>Agency desk</a>
    <nav aria-label="Main"><a href="./">Customer site</a><button id="logout" type="button" hidden>Sign out</button></nav>
  </header>

  <main class="desk">
    <section id="gate" class="gate" aria-labelledby="gate-title" hidden>
      <h1 id="gate-title">Sign in</h1>
      <form id="gate-form">
        <label for="token">Agency password</label>
        <input id="token" type="password" autocomplete="current-password" required aria-describedby="gate-error">
        <p class="problem" id="gate-error" role="alert"></p>
        <button class="btn btn-primary" type="submit">Sign in</button>
      </form>
    </section>

    <div id="board" hidden>
      <section class="todo" aria-labelledby="todo-title">
        <div class="section-head">
          <h1 id="todo-title">Waiting for you</h1>
          <button class="btn btn-quiet" type="button" id="sweep">Find quiet leads</button>
        </div>
        <p class="fine">The assistant never messages anyone by itself. "Find quiet leads" drafts a follow-up for leads who stopped replying; you approve each one.</p>
        <p id="sweep-note" class="note" role="status"></p>
        <div id="followups" class="list"></div>
      </section>

      <section aria-labelledby="pipe-title">
        <div class="section-head"><h2 id="pipe-title">Leads</h2><p id="updated" class="fine" role="status"></p></div>
        <div class="pipeline">
          <div class="col"><h3>New <span id="c-new">0</span></h3><div id="k-new" class="list"></div></div>
          <div class="col"><h3>Qualified <span id="c-qualified">0</span></h3><div id="k-qualified" class="list"></div></div>
          <div class="col"><h3>Visit booked <span id="c-visit_booked">0</span></h3><div id="k-visit_booked" class="list"></div></div>
        </div>
      </section>

      <section aria-labelledby="visit-title">
        <div class="section-head"><h2 id="visit-title">Visits</h2></div>
        <div class="table" tabindex="0" role="region" aria-label="Visits">
          <table><thead><tr><th scope="col">When</th><th scope="col">Home</th><th scope="col">Lead</th><th scope="col">Status</th></tr></thead><tbody id="visits"></tbody></table>
        </div>
      </section>

      <section aria-labelledby="cost-title">
        <div class="section-head"><h2 id="cost-title">Assistant costs</h2></div>
        <div id="usage" class="usage"></div>
      </section>
    </div>
  </main>
  <script src="admin.js"></script>
</body>
</html>
